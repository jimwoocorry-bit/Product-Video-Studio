name: pvs-web-fnos-test
services:
  pvs:
    build: .
    image: pvs-web-fnos:0.1.0
    container_name: pvs-web-fnos-test
    init: true
    restart: unless-stopped
    shm_size: 512mb
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - seccomp=./deploy/chromium-seccomp.json
    ports:
      - "${PVS_BIND_ADDRESS:-127.0.0.1}:${PVS_HTTP_PORT:-3092}:3090"
    env_file:
      - instance.env
    volumes:
      - ./data:/data
    stop_grace_period: 25s
